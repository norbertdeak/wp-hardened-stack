# nginx main config: no version banner, no server tokens, sane worker limits.
user  nginx;
worker_processes  auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    client_max_body_size 64m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # Never log credentials or the query string of sensitive endpoints
    log_format main '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" rt=$request_time';
    access_log /dev/stdout main;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Rate limit zones (shared memory, no external dependency)
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

    include /etc/nginx/conf.d/*.conf;
}
