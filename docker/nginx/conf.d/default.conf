# HTTP-only dev server. Production uses prod.conf with TLS.
server {
    listen 8080;
    server_name _;

    root /var/www/html;
    index index.php;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }

    # Block dotfiles and common leak paths before anything else
    location ~ /\.(?!well-known) { deny all; return 404; }
    location ~* \.(env|ini|log|sql|bak|old|swp|dist)$ { deny all; return 404; }

    # WordPress uploads: never execute PHP here
    location ~* ^/wp-content/uploads/.*\.php$ { deny all; return 403; }

    # XML-RPC and author enumeration are the two cheapest attack surfaces
    location = /xmlrpc.php { deny all; return 403; }
    location ~* /\?author=\d+ { return 301 /; }

    location = /wp-login.php {
        limit_req zone=login burst=3 nodelay;
        include /etc/nginx/snippets/fastcgi.conf;
    }

    location / {
        limit_req zone=general burst=60 nodelay;
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include /etc/nginx/snippets/fastcgi.conf;
    }

    location ~ /\.ht { deny all; }
}
