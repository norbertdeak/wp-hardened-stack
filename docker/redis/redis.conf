# Redis: internal network only, password required, dangerous commands renamed.
bind 0.0.0.0
protected-mode yes
port 6379
# requirepass a compose command-ból jön (env), így titok nem kerül a fájlba.

maxmemory 256mb
maxmemory-policy allkeys-lru

# Rename destructive commands so a compromised app cannot wipe the cache
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG "CONFIG_DISABLED"
rename-command SHUTDOWN ""

appendonly no
save 900 1
